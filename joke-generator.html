<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Joke Generator</title>
    <script>
        async function fetchJoke() {
            try {
                const response = await fetch('https://official-joke-api.appspot.com/jokes/random');
                const jokeData = await response.json();
                document.getElementById('joke').innerText = `${jokeData.setup} - ${jokeData.punchline}`;
            } catch (error) {
                document.getElementById('joke').innerText = 'Failed to fetch a joke.';
            }
        }
    </script>
</head>
<body>
    <h1>Random Joke Generator</h1>
    <button onclick="fetchJoke()">Tell me a joke</button>
    <p id="joke">Press the button to generate a joke!</p>
</body>
</html>
